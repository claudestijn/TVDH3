<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#9D181D" />
<title>TVD Herren 3 · Stat-Tracker</title>
<link rel="icon" type="image/svg+xml" href="https://www.tvderendingen.de/de-wGlobal/wGlobal/layout/images/Logo-TVD.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --red:#9D181D; --red2:#E0353B; --ink:#121212; --s1:#1C1C1C; --s2:#262626; --line:#2E2E2E;
    --text:#FFFFFF; --muted:#A6A6A6; --muted2:#717171; --warn:#F5A524;
    --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);color:var(--text);font-family:var(--body);
    display:flex;flex-direction:column;min-height:100dvh;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button,select{font:inherit;color:inherit}
  button{appearance:none;border:0;background:none;cursor:pointer}
  button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button:active{transform:scale(.965)}

  /* ---- Kopfzeile ---- */
  .bar{background:var(--red);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 14px}
  .gamesel{justify-self:start;max-width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 10px;font-size:14px;color:#fff}
  .gamesel option{color:#000}
  .score{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700}
  .score .tn{font-size:18px;color:#F2C4C5;max-width:18vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score b{font-size:46px;line-height:1;min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums}
  .score i{font-style:normal;font-size:34px;color:#F2C4C5}
  .barR{justify-self:end;display:flex;gap:10px;align-items:center}
  .qs{display:flex;background:rgba(0,0,0,.25);border-radius:8px;padding:3px}
  .qs button{font-family:var(--disp);font-weight:700;font-size:17px;padding:8px 10px;border-radius:6px;color:#F2C4C5;min-width:42px}
  .qs button[aria-pressed="true"]{background:#fff;color:var(--red)}
  .btnTop{font-family:var(--disp);font-weight:700;font-size:16px;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:8px 12px;white-space:nowrap}
  .qline{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;padding:6px 10px;font-family:var(--disp);font-size:15px;color:var(--muted);border-bottom:1px solid var(--line);min-height:31px;font-variant-numeric:tabular-nums}
  .qline b{color:var(--text);font-weight:600}
  .qline .now{color:#fff}

  /* ---- Spielfeld: zwei Seiten ---- */
  .court{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .side{background:var(--ink);display:flex;flex-direction:column;padding:12px 14px 14px;gap:10px;min-width:0}
  .side.tvd{--acc:var(--red2);--hitbg:var(--red2);--hittx:#fff}
  .side.opp{--acc:#fff;--hitbg:#EDEDED;--hittx:#121212}
  .side h2{font-family:var(--disp);font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side h2::before{content:"";width:6px;height:22px;border-radius:2px;background:var(--acc);flex:none}
  .shot{flex:1;display:grid;grid-template-columns:1.35fr 1fr 86px;gap:8px;min-height:74px}
  .hit,.miss,.ex{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s}
  .hit{background:var(--hitbg);color:var(--hittx)}
  .hit .big{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1}
  .hit .sm{font-size:12px;font-weight:600;opacity:.8;margin-top:3px}
  .miss{border:1.5px solid #4a4a4a}
  .miss .big{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1}
  .miss .sm{font-size:12px;color:var(--muted);margin-top:3px}
  .val{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-variant-numeric:tabular-nums}
  .val b{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1;display:inline-block}
  .val small{color:var(--muted);font-size:12px;margin-top:4px}
  .extras{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:74px}
  .ex{background:var(--s1);border:1.5px solid var(--line);flex-direction:row;gap:10px;padding:0 10px}
  .ex .lbl{font-size:13px;font-weight:600;color:var(--muted);text-align:left;line-height:1.2}
  .ex .lbl small{font-weight:400;font-size:11px;color:var(--muted2)}
  .ex b{font-family:var(--disp);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block}
  .ex.bonus{border-color:var(--warn)}
  .ex.bonus .lbl,.ex.bonus .lbl small{color:var(--warn)}
  .bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:scale(1.3)}100%{transform:none}}

  /* ---- Verlauf ---- */
  .log{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--s1)}
  #undo{font-family:var(--disp);font-weight:700;font-size:17px;border:1.5px solid #555;border-radius:8px;padding:10px 14px;flex:none}
  #undo:disabled{opacity:.35}
  .chips{display:flex;gap:6px;overflow:hidden;flex:1;min-width:0}
  .chip{flex:none;font-size:13px;padding:7px 11px;border-radius:999px;background:var(--s2);color:var(--muted);white-space:nowrap}
  .chip.H{box-shadow:inset 3px 0 0 var(--red2)}
  .chip.G{box-shadow:inset 3px 0 0 #fff}
  .chip.arm{background:#5c1013;color:#fff}
  .chips .empty{font-size:13px;color:var(--muted2)}
  .store{font-size:11px;color:var(--muted2);flex:none;text-align:right;max-width:150px}
  .store.err{color:#ffb4a2}

  /* ---- Auswertung ---- */
  .ov{position:fixed;inset:0;background:var(--ink);overflow:auto;z-index:10;padding:16px 16px 40px;-webkit-user-select:text;user-select:text}
  .ov[hidden]{display:none}
  .ovh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1100px;margin:0 auto 16px}
  .ovh h2{font-family:var(--disp);font-size:28px;flex:1;min-width:200px}
  .obtn{font-family:var(--disp);font-weight:700;font-size:16px;border:1.5px solid #555;border-radius:8px;padding:9px 13px;white-space:nowrap}
  .obtn.pri{background:var(--red2);border-color:var(--red2)}
  .obtn.danger{color:#ffb4a2;border-color:#6b2a2a}
  .omsg{max-width:1100px;margin:-6px auto 12px;font-size:13px;color:#9be3bd;min-height:18px}
  .tbls{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  caption{text-align:left;font-family:var(--disp);font-weight:700;font-size:21px;padding:0 0 8px;caption-side:top}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;color:var(--muted);font-weight:400}
  thead th{color:var(--muted);font-weight:600;font-size:12px}
  td.tot{font-weight:700}
  tr.gap td{border-bottom:0;padding:4px}
  .note{max-width:1100px;margin:18px auto 0;font-size:12.5px;color:var(--muted2);line-height:1.5}

  @media(max-width:880px){
    .bar{display:flex;flex-wrap:wrap;justify-content:space-between}
    .score{order:-1;width:100%;justify-content:center}
    .score .tn{max-width:30vw}
    .tbls{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .court{grid-template-columns:1fr}
    .shot{grid-template-columns:1.3fr 1fr 74px}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="bar">
  <select id="game" class="gamesel" aria-label="Spiel wählen"></select>
  <div class="score" aria-live="polite">
    <span class="tn">TVD 3</span><b id="scH">0</b><i>:</i><b id="scG">0</b><span class="tn" id="oppShort">Gegner</span>
  </div>
  <div class="barR">
    <div class="qs" id="qs" role="group" aria-label="Viertel"></div>
    <button class="btnTop" id="btnStats">Auswertung</button>
  </div>
</header>
<div class="qline" id="qline"></div>

<main class="court">
  <section class="side tvd" id="sideH"></section>
  <section class="side opp" id="sideG"></section>
</main>

<footer class="log">
  <button id="undo">Rückgängig</button>
  <div class="chips" id="log"></div>
  <div class="store" id="store"></div>
</footer>

<div class="ov" id="ov" hidden>
  <div class="ovh">
    <h2 id="ovTitle">Auswertung</h2>
    <button class="obtn pri" id="copyXls">Tabelle kopieren (Excel)</button>
    <button class="obtn" id="copyTxt">Kurzbericht kopieren</button>
    <button class="obtn danger" id="resetGame">Spiel leeren</button>
    <button class="obtn" id="ovClose">Zurück</button>
  </div>
  <div class="omsg" id="omsg"></div>
  <div class="tbls" id="tbls"></div>
  <p class="note">Possessions sind geschätzt: Würfe aus dem Feld + 0,44 × Freiwürfe − Off. Rebounds + Ballverluste. eFG % = (2er-Treffer + 1,5 × 3er-Treffer) / Würfe aus dem Feld. True Shooting % = Punkte / (2 × (Würfe aus dem Feld + 0,44 × Freiwürfe)).</p>
</div>

<script>
const KEY = "tvd-tracker:v1";
const GAMES = [   // [Datum, Gegner, Heim?]
  ["2026-10-10","TB Kirchentellinsfurt 2",0],
  ["2026-10-18","TuS Metzingen 2",1],
  ["2026-11-08","SV Pfrondorf",0],
  ["2026-11-15","SV Böblingen Panthers 2",1],
  ["2026-11-21","VfL Sindelfingen 3",0],
  ["2026-11-29","SV 03 Tigers Tübingen 3",1],
  ["2026-12-06","SpVgg Mössingen 2",0],
  ["2026-12-12","SV 03 Tigers Tübingen 3",0],
  ["2026-12-20","SpVgg Mössingen 2",1],
  ["2027-01-31","TB Kirchentellinsfurt 2",1],
  ["2027-02-21","TuS Metzingen 2",0],
  ["2027-02-28","SV Pfrondorf",1],
  ["2027-03-06","SV Böblingen Panthers 2",0],
  ["2027-03-14","VfL Sindelfingen 3",1]
];
const QS = ["1","2","3","4","OT"];
const QLBL = {"1":"1.","2":"2.","3":"3.","4":"4.","OT":"OT"};
const SHOTS = [["2P",2,"Zweier"],["3P",3,"Dreier"],["FT",1,"Freiwurf"]];
const EXTRAS = [["OR","Off.<br>Rebound"],["TO","Ball&shy;verlust"],["PF","Foul<br><small>im Viertel</small>"]];
const TLBL = {"2P":"2er","3P":"3er","FT":"FW","OR":"Off. Reb.","TO":"Ballverl.","PF":"Foul"};
const DOW = ["So","Mo","Di","Mi","Do","Fr","Sa"];

let S = {current:"", games:{}}, storeOk = true, armId = null, armTimer = null, resetArm = false;
try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && o.games) S = o; } }catch(e){ storeOk = false; }

const pad = n => String(n).padStart(2,"0");
const isoToday = () => { const t = new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); };
function meta(id){ const g = GAMES.find(x => x[0] === id); return g ? {opp:g[1], home:!!g[2]} : {opp:"Gegner", home:true}; }
function cur(){ if(!S.games[S.current]) S.games[S.current] = {q:"1", ev:[]}; return S.games[S.current]; }
function defaultGame(){ const t = isoToday(); const g = GAMES.find(x => x[0] >= t); return g ? g[0] : "frei"; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storeOk = true; }catch(e){ storeOk = false; } renderStore(); }

// Spielwahl: gespeichertes Spiel behalten, sonst heutiges/nächstes
if(!S.current || !(S.games[S.current] && S.games[S.current].ev.length)) S.current = defaultGame();

// ---- Zählen ----
function agg(ev, side, q){
  const a = {p2a:0,p2m:0,p3a:0,p3m:0,fta:0,ftm:0,or:0,to:0,pf:0};
  ev.forEach(e => {
    if(e.s !== side || (q && e.q !== q)) return;
    if(e.t === "2P"){ a.p2a++; a.p2m += e.m; }
    else if(e.t === "3P"){ a.p3a++; a.p3m += e.m; }
    else if(e.t === "FT"){ a.fta++; a.ftm += e.m; }
    else if(e.t === "OR") a.or++;
    else if(e.t === "TO") a.to++;
    else if(e.t === "PF") a.pf++;
  });
  a.pts = 2*a.p2m + 3*a.p3m + a.ftm;
  a.fga = a.p2a + a.p3a;
  a.poss = a.fga + 0.44*a.fta - a.or + a.to;
  a.ppp = a.poss > 0 ? a.pts / a.poss : NaN;
  a.efg = a.fga ? (a.p2m + 1.5*a.p3m) / a.fga : NaN;
  const tsa = a.fga + 0.44*a.fta;
  a.ts = tsa ? a.pts / (2*tsa) : NaN;
  return a;
}
const pct = (m,a) => a ? Math.round(m/a*100)+" %" : "–";
const pctV = x => isFinite(x) ? Math.round(x*100)+" %" : "–";
const dec = (x,n) => isFinite(x) ? x.toFixed(n).replace(".",",") : "–";
function usedQs(){
  const g = cur();
  let idx = Math.max(3, QS.indexOf(g.q));
  g.ev.forEach(e => { idx = Math.max(idx, QS.indexOf(e.q)); });
  return QS.slice(0, idx+1);
}
function foulsNow(side){   // Teamfouls: OT zählt zum 4. Viertel (FIBA)
  const g = cur();
  return g.ev.filter(e => e.s === side && e.t === "PF" && (g.q === "OT" ? (e.q === "4" || e.q === "OT") : e.q === g.q)).length;
}

// ---- Aufbau ----
function buildSelect(){
  const sel = document.getElementById("game");
  sel.innerHTML = GAMES.map(([id,opp,h]) => {
    const [y,m,d] = id.split("-").map(Number), dt = new Date(y,m-1,d);
    return '<option value="'+id+'">'+DOW[dt.getDay()]+' '+d+'.'+m+'. · '+(h?'vs ':'@ ')+opp+'</option>';
  }).join("") + '<option value="frei">Anderes Spiel / Training</option>';
}
function buildSide(side){
  const host = document.getElementById("side"+side);
  host.innerHTML = '<h2 id="name'+side+'"></h2>' +
    SHOTS.map(([t,p,l]) =>
      '<div class="shot">'+
        '<button class="hit" data-act="'+side+'|'+t+'|1"><span class="big">+'+p+'</span><span class="sm">'+l+' Treffer</span></button>'+
        '<button class="miss" data-act="'+side+'|'+t+'|0"><span class="big">'+l+'</span><span class="sm">daneben</span></button>'+
        '<div class="val"><b id="v'+side+t+'">0/0</b><small id="p'+side+t+'">–</small></div>'+
      '</div>').join("") +
    '<div class="extras">'+EXTRAS.map(([t,l]) =>
      '<button class="ex" id="x'+side+t+'" data-act="'+side+'|'+t+'|0"><span class="lbl">'+l+'</span><b id="v'+side+t+'">0</b></button>').join("")+'</div>';
}

// ---- Anzeige ----
function render(){
  const g = cur(), m = meta(S.current);
  document.getElementById("game").value = S.current;
  document.getElementById("oppShort").textContent = m.opp;
  document.getElementById("nameH").textContent = "TVD 3";
  document.getElementById("nameG").textContent = m.opp;
  const H = agg(g.ev,"H"), G = agg(g.ev,"G");
  document.getElementById("scH").textContent = H.pts;
  document.getElementById("scG").textContent = G.pts;
  document.getElementById("qs").innerHTML = QS.map(q =>
    '<button data-q="'+q+'" aria-pressed="'+(g.q===q)+'">'+(q==="OT"?"OT":"Q"+q)+'</button>').join("");
  document.getElementById("qline").innerHTML = usedQs().map(q => {
    const h = agg(g.ev,"H",q).pts, o = agg(g.ev,"G",q).pts;
    return '<span class="'+(q===g.q?'now':'')+'">'+QLBL[q]+(q==="OT"?'':' V')+' <b>'+h+':'+o+'</b></span>';
  }).join("");
  [["H",H],["G",G]].forEach(([s,a]) => {
    setTxt("v"+s+"2P", a.p2m+"/"+a.p2a); setTxt("p"+s+"2P", pct(a.p2m,a.p2a));
    setTxt("v"+s+"3P", a.p3m+"/"+a.p3a); setTxt("p"+s+"3P", pct(a.p3m,a.p3a));
    setTxt("v"+s+"FT", a.ftm+"/"+a.fta); setTxt("p"+s+"FT", pct(a.ftm,a.fta));
    setTxt("v"+s+"OR", a.or); setTxt("v"+s+"TO", a.to);
    const f = foulsNow(s);
    setTxt("v"+s+"PF", f);
    document.getElementById("x"+s+"PF").classList.toggle("bonus", f >= 4);   // ab 4 Teamfouls: nächstes Foul = Freiwürfe
  });
  renderLog();
  renderStore();
}
function setTxt(id, v){ const el = document.getElementById(id); if(el) el.textContent = v; }
function renderLog(){
  const g = cur(), host = document.getElementById("log");
  document.getElementById("undo").disabled = !g.ev.length;
  if(!g.ev.length){ host.innerHTML = '<span class="empty">Noch keine Aktionen — einfach lostippen.</span>'; return; }
  host.innerHTML = g.ev.slice(-10).reverse().map(e => {
    const armed = e.id === armId;
    const mark = (e.t==="2P"||e.t==="3P"||e.t==="FT") ? (e.m ? " ✓" : " ✗") : "";
    const who = e.s === "H" ? "TVD" : "Geg.";
    return '<button class="chip '+e.s+(armed?' arm':'')+'" data-id="'+e.id+'">'+(armed ? 'Löschen?' : QLBL[e.q]+' '+who+' '+TLBL[e.t]+mark)+'</button>';
  }).join("");
}
function renderStore(){
  const el = document.getElementById("store");
  el.className = "store"+(storeOk?"":" err");
  el.textContent = storeOk ? "Auf diesem Gerät gespeichert" : "Speichern nicht möglich – Seite nicht neu laden!";
}
function bump(id){ const el = document.getElementById(id); if(!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// ---- Aktionen ----
function add(side, t, made){
  const g = cur();
  g.ev.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), q:g.q, s:side, t:t, m:made});
  save(); render();
  bump("v"+side+t); bump(side==="H"?"scH":"scG");
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function disarm(){ armId = null; if(armTimer){ clearTimeout(armTimer); armTimer = null; } }

// ---- Auswertung ----
function tableFor(side){
  const g = cur(), qs = usedQs();
  const cols = qs.map(q => agg(g.ev,side,q)).concat([agg(g.ev,side)]);
  const R = [
    ["Punkte", a => a.pts],
    ["Possessions (geschätzt)", a => Math.round(a.poss)],
    ["Punkte / Possession", a => dec(a.ppp,2)],
    null,
    ["2er", a => a.p2m+"/"+a.p2a], ["2er %", a => pct(a.p2m,a.p2a)],
    ["3er", a => a.p3m+"/"+a.p3a], ["3er %", a => pct(a.p3m,a.p3a)],
    ["Freiwürfe", a => a.ftm+"/"+a.fta], ["Freiwurf %", a => pct(a.ftm,a.fta)],
    null,
    ["eFG %", a => pctV(a.efg)], ["True Shooting %", a => pctV(a.ts)],
    ["Punkte aus 2/3/FW", a => (2*a.p2m)+"/"+(3*a.p3m)+"/"+a.ftm],
    null,
    ["Off. Rebounds", a => a.or], ["Ballverluste", a => a.to], ["Fouls", a => a.pf]
  ];
  const name = side === "H" ? "TVD 3" : meta(S.current).opp;
  return '<div class="tw"><table><caption>'+name+'</caption><thead><tr><th></th>'+
    qs.map(q => '<th>'+(q==="OT"?"OT":"Q"+q)+'</th>').join("")+'<th>Gesamt</th></tr></thead><tbody>'+
    R.map(r => r ? '<tr><td>'+r[0]+'</td>'+cols.map((a,i) => '<td'+(i===cols.length-1?' class="tot"':'')+'>'+r[1](a)+'</td>').join("")+'</tr>'
                 : '<tr class="gap"><td colspan="'+(cols.length+1)+'"></td></tr>').join("")+
    '</tbody></table></div>';
}
function renderOv(){
  const g = cur(), m = meta(S.current), H = agg(g.ev,"H"), G = agg(g.ev,"G");
  document.getElementById("ovTitle").textContent = "TVD 3 "+(m.home?"vs":"@")+" "+m.opp+" · "+H.pts+":"+G.pts;
  document.getElementById("tbls").innerHTML = tableFor("H") + tableFor("G");
}
// Zeilen wie in der bestehenden Excel-Auswertung (TVD links, Gegner rechts)
function excelText(){
  const g = cur(), qs = usedQs();
  const rows = [["Possessions", a => Math.round(a.poss)], ["Offensivrebounds", a => a.or], ["Turnovers", a => a.to], null,
    ["Punkte", a => a.pts], ["2er Attempts", a => a.p2a], ["2er Makes", a => a.p2m], ["3er Attempts", a => a.p3a],
    ["3er Makes", a => a.p3m], ["Freiwürfe", a => a.fta], ["Freiwürfe Makes", a => a.ftm]];
  const colsH = qs.map(q => agg(g.ev,"H",q)).concat([agg(g.ev,"H")]);
  const colsG = qs.map(q => agg(g.ev,"G",q)).concat([agg(g.ev,"G")]);
  const head = ["Quarter"].concat(qs.map(q => q==="OT"?"OT":q), ["Gesamt",""], qs.map(q => q==="OT"?"OT":q), ["Gesamt"]);
  const lines = [["","TVD"].concat(Array(qs.length+1).fill(""), [meta(S.current).opp]).join("\t"), head.join("\t")];
  rows.forEach(r => {
    if(!r){ lines.push(""); return; }
    lines.push([r[0]].concat(colsH.map(r[1]), [""], colsG.map(r[1])).join("\t"));
  });
  return lines.join("\n");
}
function summaryText(){
  const g = cur(), m = meta(S.current), H = agg(g.ev,"H"), G = agg(g.ev,"G");
  const qs = usedQs().map(q => agg(g.ev,"H",q).pts+":"+agg(g.ev,"G",q).pts).join(", ");
  const line = (n,a) => n+": 2er "+a.p2m+"/"+a.p2a+" ("+pct(a.p2m,a.p2a)+"), 3er "+a.p3m+"/"+a.p3a+" ("+pct(a.p3m,a.p3a)+"), FW "+a.ftm+"/"+a.fta+" ("+pct(a.ftm,a.fta)+"), Off. Reb. "+a.or+", Ballverluste "+a.to+", Pkt/Poss "+dec(a.ppp,2);
  return "🏀 TVD 3 "+(m.home?"vs":"@")+" "+m.opp+" "+H.pts+":"+G.pts+"\nViertel: "+qs+"\n"+line("TVD",H)+"\n"+line("Gegner",G);
}
async function copy(text, okMsg){
  const msg = document.getElementById("omsg");
  try{ await navigator.clipboard.writeText(text); msg.textContent = okMsg; return; }catch(e){}
  try{
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    msg.textContent = ok ? okMsg : "Kopieren nicht möglich – Browser blockiert die Zwischenablage.";
  }catch(e){ msg.textContent = "Kopieren nicht möglich – Browser blockiert die Zwischenablage."; }
}

// ---- Bildschirm wach halten (Tablet) ----
let wake = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wake && !document.hidden){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) keepAwake(); });
document.addEventListener("pointerdown", keepAwake, {passive:true});

// ---- Ereignisse ----
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.act){ disarm(); const [s,t,m] = b.dataset.act.split("|"); add(s, t, Number(m)); }
  else if(b.dataset.q){ cur().q = b.dataset.q; save(); render(); }
  else if(b.id === "undo"){ disarm(); cur().ev.pop(); save(); render(); }
  else if(b.dataset.id){
    if(armId === b.dataset.id){ const g = cur(); g.ev = g.ev.filter(x => x.id !== armId); disarm(); save(); render(); }
    else{ disarm(); armId = b.dataset.id; armTimer = setTimeout(() => { disarm(); renderLog(); }, 3000); renderLog(); }
  }
  else if(b.id === "btnStats"){ document.getElementById("omsg").textContent = ""; renderOv(); document.getElementById("ov").hidden = false; }
  else if(b.id === "ovClose"){ document.getElementById("ov").hidden = true; }
  else if(b.id === "copyXls"){ copy(excelText(), "Tabelle kopiert ✓ — in Excel in die erste Zelle einfügen."); }
  else if(b.id === "copyTxt"){ copy(summaryText(), "Kurzbericht kopiert ✓ — z. B. in den Team-Chat einfügen."); }
  else if(b.id === "resetGame"){
    if(!resetArm){ resetArm = true; b.textContent = "Wirklich leeren?"; setTimeout(() => { resetArm = false; b.textContent = "Spiel leeren"; }, 3500); }
    else{ resetArm = false; b.textContent = "Spiel leeren"; S.games[S.current] = {q:"1", ev:[]}; save(); render(); renderOv(); }
  }
});
document.getElementById("game").addEventListener("change", e => { disarm(); S.current = e.target.value; cur(); save(); render(); });

buildSelect(); buildSide("H"); buildSide("G"); render();
</script>
